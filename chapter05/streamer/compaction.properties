# Chapter 5, "Configuring compaction with HoodieStreamer": a Merge-on-Read table ingested in
# continuous mode, where compaction runs asynchronously by default. Used by
# scripts/run_streamer_compaction.sh with Chapter 3's NYC taxi sample.

# Record key and partition, as in Chapter 3: the dataset has no trip ID column, so six columns
# together identify a trip.
hoodie.datasource.write.recordkey.field=VendorID,tpep_pickup_datetime,PULocationID,DOLocationID,trip_distance,total_amount
hoodie.datasource.write.partitionpath.field=date_col

# Compaction cadence/strategy (Streamer reads these)
hoodie.compact.inline.trigger.strategy=NUM_OR_TIME
hoodie.compact.inline.max.delta.commits=10
hoodie.compact.inline.max.delta.seconds=1800
# Optional: bound IO if you try inline at times
hoodie.compaction.target.io=20480
