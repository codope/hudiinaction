# Chapter 5, "Configuring the indexer": HoodieIndexer settings for building a record index while
# HoodieStreamer keeps writing. The lock settings must match write.properties.

hoodie.metadata.enable=true
hoodie.metadata.index.async=true
# Global record index (the chapter's hoodie.metadata.record.index.enable is an alias of this key)
hoodie.metadata.global.record.level.index.enable=true
hoodie.metadata.index.check.timeout.seconds=60
hoodie.write.concurrency.mode=optimistic_concurrency_control
hoodie.clean.failed.writes.policy=LAZY

# Same lock provider as the writer (see write.properties for the ZooKeeper variant)
hoodie.write.lock.provider=org.apache.hudi.client.transaction.lock.FileSystemBasedLockProvider
