# Chapter 5, "Configuring Ingestion writer": the HoodieStreamer writer that keeps ingesting while
# HoodieIndexer builds a record index. Used by scripts/run_async_indexing.sh with Chapter 3's
# NYC taxi sample; the source path and schema file are passed on the command line.

# Record key and partition, as in Chapter 3: the dataset has no trip ID column, so six columns
# together identify a trip. The ordering field is passed as --source-ordering-fields.
hoodie.datasource.write.recordkey.field=VendorID,tpep_pickup_datetime,PULocationID,DOLocationID,trip_distance,total_amount
hoodie.datasource.write.partitionpath.field=date_col

# The writer must enable the index the indexer builds. With hoodie.metadata.index.async=true the
# writer does not build it itself; it leaves that to HoodieIndexer and keeps the index up to date
# once it exists.
hoodie.metadata.enable=true
hoodie.metadata.index.async=true
# Global record index (the chapter's hoodie.metadata.record.index.enable is an alias of this key)
hoodie.metadata.global.record.level.index.enable=true
# Spark writes the metadata table in streaming mode by default, and in 1.2.1 that path updates
# the record index as soon as it is enabled, before HoodieIndexer has built it, and fails. The
# non-streaming path updates only the indexes recorded in the table's hoodie.properties.
hoodie.metadata.streaming.write.enabled=false

# Two processes write to this table, so both need optimistic concurrency control, lazy cleaning
# of failed writes, and the same lock provider.
hoodie.write.concurrency.mode=optimistic_concurrency_control
hoodie.clean.failed.writes.policy=LAZY

# Lock provider for a local run: a lock file under the table's .hoodie folder. It relies on atomic
# file creation, so use it only on local disk or HDFS, never on cloud object storage.
hoodie.write.lock.provider=org.apache.hudi.client.transaction.lock.FileSystemBasedLockProvider

# The chapter's production setup uses ZooKeeper instead:
# hoodie.write.lock.provider=org.apache.hudi.client.transaction.lock.ZookeeperBasedLockProvider
# hoodie.write.lock.zookeeper.url=<zk_url>
# hoodie.write.lock.zookeeper.port=<zk_port>
# hoodie.write.lock.zookeeper.lock_key=<zk_key>
# hoodie.write.lock.zookeeper.base_path=<zk_base_path>
