# Silver HoodieStreamer settings for a Python-only setup: the same table and source as
# silver-hoodiestreamer.properties, with VendorPayoutTransformer replaced by Hudi's built-in
# SqlQueryBasedTransformer, so no Scala build is needed. <SRC> stands for the incoming batch.
# Hudi reads this file one line at a time, so the query must stay on a single line.
include=silver-hoodiestreamer.properties
hoodie.deltastreamer.transformer.class=org.apache.hudi.utilities.transform.SqlQueryBasedTransformer
hoodie.streamer.transformer.sql=SELECT vendor_id, date_format(line_opened_ts, 'yyyy-MM-dd') AS payout_date, order_id, order_line_id, customer_id, country, currency, gross_to_date AS gross_amount, refund_to_date AS refund_amount, fee_to_date AS fee_amount, chargeback_to_date AS chargeback_amount, gross_to_date - refund_to_date - fee_to_date - chargeback_to_date AS net_payout_amount, line_opened_ts AS first_event_ts, event_ts AS last_event_ts, line_version, current_timestamp() AS last_updated_ts, event_type AS last_event_type FROM <SRC>
