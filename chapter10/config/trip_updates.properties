# Chapter 10, "Grouping configuration by decision": the grouped configuration bundle for the
# trip_updates pipeline. scripts/submit_trip_updates.sh passes this file as --props.
#
# Every value was derived in the chapter. Groups are ordered by purpose, not by namespace, and the
# comments are part of the artifact: a durable property that looks like any other line is a
# durable property somebody will change during an incident.
# Target: Apache Hudi 1.2.1. Replace every <placeholder> before use.

# --- Table identity and storage - DURABLE ---
hoodie.table.type=MERGE_ON_READ
hoodie.datasource.write.recordkey.field=trip_id
hoodie.datasource.write.partitionpath.field=trip_date
hoodie.datasource.write.hive_style_partitioning=true

# --- Writer semantics ---
hoodie.datasource.write.operation=upsert
hoodie.table.ordering.fields=updated_at

# --- Partitioned record-level index - SIZED PER PARTITION WHEN FIRST WRITTEN ---
# Counts are PER PARTITION, and partitions created after initialization get the min.
# min == max gives every partition the chosen size.
hoodie.index.type=RECORD_LEVEL_INDEX
hoodie.metadata.record.level.index.enable=true
hoodie.metadata.record.level.index.min.filegroup.count=12
hoodie.metadata.record.level.index.max.filegroup.count=12

# --- Read path: column statistics on the three recurring predicates ---
hoodie.metadata.index.column.stats.enable=true
hoodie.metadata.index.column.stats.column.list=city_id,updated_at,fare_amount

# --- History: 48 hours of file versions; archival bounds from the 5-minute cadence ---
hoodie.clean.policy=KEEP_LATEST_BY_HOURS
hoodie.clean.hours.retained=48
hoodie.keep.min.commits=634
hoodie.keep.max.commits=761

# --- Concurrency - this block goes in EVERY job that writes this table ---
# Determined for AWS with no ZooKeeper standard. On another platform, replace the lock provider
# lines with the platform standard. The implicit variant derives the lock key from the base path,
# so hoodie.write.lock.dynamodb.partition_key is deliberately not set.
hoodie.write.concurrency.mode=OPTIMISTIC_CONCURRENCY_CONTROL
hoodie.write.lock.provider=org.apache.hudi.aws.transaction.lock.DynamoDBBasedImplicitPartitionKeyLockProvider
hoodie.write.lock.dynamodb.table=<lock table name>
hoodie.write.lock.dynamodb.region=<aws region>
hoodie.clean.failed.writes.policy=LAZY

# --- Glue catalog (sync itself is switched on in the submit command) ---
hoodie.datasource.hive_sync.database=<glue database>
hoodie.datasource.hive_sync.table=trip_updates
hoodie.datasource.hive_sync.partition_fields=trip_date
# Sync only on schema or partition change. Default is false, which
# writes a new Glue catalog version on EVERY commit.
hoodie.datasource.meta_sync.condition.sync=true

# --- Source: Kafka brokers, topic, and schema registry URL for your environment ---
bootstrap.servers=<kafka brokers>
auto.offset.reset=earliest
hoodie.streamer.source.kafka.topic=<topic>
schema.registry.url=<schema registry url>
hoodie.streamer.schemaprovider.registry.url=<schema registry url>/subjects/<topic>-value/versions/latest

# Deliberately not set: hoodie.upsert.shuffle.parallelism. The interview captured no executor
# count, batch size, skew, or source rate, so the benchmark tunes it from observed behavior.
